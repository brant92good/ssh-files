name: Native checks and releases
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ''
          - os: macos-14
            target: aarch64-apple-darwin
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare compiler
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt --target ${{ matrix.target }}
      - name: Prepare static Linux linker and disposable SSH server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
          sudo apt-get install -y musl-tools openssh-server
          sudo mkdir -p /run/sshd
          python -m pip install pyte==0.8.2 wcwidth==0.2.13
      - run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 test --locked --all-targets --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: cargo +1.94.0 clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: cargo +1.94.0 build --release --locked --bins --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Fresh compiled install, update, checksum and environment checks
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/ssh-files
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/check_native_install.py --binary "$binary" --with-path
      - name: Actual OpenSSH transfers, UI, bracketed paste and terminal-close cleanup
        if: runner.os == 'Linux'
        run: python scripts/check_linux.py --binary target/${{ matrix.target }}/release/ssh-files-proof --ui-binary target/${{ matrix.target }}/release/ssh-files --sudo-sshd --adversarial --report artifacts/linux-transport.json
      - name: Actual successful finalization with its reply withheld
        if: runner.os == 'Linux'
        run: python scripts/check_linux.py --binary target/${{ matrix.target }}/release/ssh-files-proof --sudo-sshd --lost-ack --report artifacts/linux-lost-ack.json
      - name: Package only the tested UI binary, checksum and licenses
        run: python scripts/package_native.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Preserve fixture results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checks-${{ matrix.target }}
          path: artifacts/linux-*
          if-no-files-found: ignore
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "SSH Files $GITHUB_REF_NAME beta" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
  released-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prerelease
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Actual tagged HTTPS installer and update
        shell: bash
        run: python scripts/check_release_install.py --version "${GITHUB_REF_NAME#v}" --report artifacts/released-install.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-${{ matrix.os }}
          path: artifacts/released-install.json
          if-no-files-found: error
