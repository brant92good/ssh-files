[package]
name = "ssh-files"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "A keyboard-driven SFTP companion for your existing OpenSSH routes"
default-run = "ssh-files"
autobins = false

[[bin]]
name = "ssh-files"
path = "src/bin/ssh-files.rs"

# Development qualification utility; never included in binary release assets.
[[bin]]
name = "ssh-files-proof"
path = "src/bin/ssh-files-proof.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
russh-sftp = { version = "=2.4.0", default-features = false }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
which = "8"
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
unicode-normalization = "=0.1.25"
caseless = "=0.2.2"
base64 = "=0.22.1"

[dev-dependencies]
tempfile = "3"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Return from terminal EOF/EIO so the UI can observe HUP and stop owned SSH.
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
